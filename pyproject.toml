[project]
name = "duckdb-kb-agent"
version = "0.1.0"
description = "Base documentaire agentique propulsée par DuckDB (FTS/BM25) et un agent IA."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    "lxml>=5.0.0",
    "mammoth>=1.8.0",
    "openai>=2.45.0",
    "pandas>=3.0.3",
    "pdf-ocr-ai @ git+https://github.com/laurentvv/pdf-ocr-ai.git",
    "pdfplumber>=0.11.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "trafilatura>=1.12.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "integration: tests nécessitant knowledge.duckdb indexé et/ou Ollama (skippés par défaut)",
]
